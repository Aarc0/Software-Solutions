#Nombre del proyecto
spring.application.name=rental-platform 

#Configura URL de la conexión con la BBDD, índica que usará H2 (BBDD temp que vive en RAM) y que se llamará rentaldb
spring.datasource.url=jdbc:h2:mem:rentaldb;

#Evita que la base de datos se cierre y se borre antes que la app se detenga
DB_CLOSE_ON_EXIT=FALSE

# username para acceder a la bbdd
spring.datasource.username=sa

# contraseña para el usuario
spring.datasource.password=

#Activa una interfaz web en http://localhost:8080/h2-console para ver las tablas y ejecutar consultas SQL 
spring.h2.console.enabled=true

# Actualiza automáticamente las tablas sin borrar datos ya existentes
spring.jpa.hibernate.ddl-auto=update

#Hace que las consultas SQL que la app realiza se impriman en consola
spring.jpa.show-sql=true