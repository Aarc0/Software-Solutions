<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Publicar un inmueble</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class=" bg-linear-to-r from-white to-gray-100">

    <header class="  justify-center">

        <h1 class="
            font-serif
            bg-linear-to-r
            bg-black
            bg-clip-text
            text-center
            tracking-wide
            md:text-6xl
        ">
            Publique un inmueble
        </h1>

    </header>
    <div>
        <label for="Precio" class=" mt-130   mb-2 block text-3xl font-medium text-gray-700" >
            Precio(Euros)
        </label>
            <input
            id="Precio"
            name="Precio"
            type="number"
            placeholder="Precio"
            class=" rounded-lg border  border-gray-300 px-2 py-2 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
            />

    </div>
    <img src="House.gif" alt="Casa" class="w-100 rounded-lg shadow-md" />
